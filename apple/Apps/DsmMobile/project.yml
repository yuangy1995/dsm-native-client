name: DsmMobile
options:
  bundleIdPrefix: io.github.qwertyuiop1995
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  DsmShared:
    path: ../..
targets:
  DsmMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
    dependencies:
      - package: DsmShared
        product: DsmLocalization
      - package: DsmShared
        product: DsmCore
      - package: DsmShared
        product: DsmNetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.qwertyuiop1995.dsmnativeclient.mobile
        PRODUCT_NAME: DsmMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/DsmMobile.entitlements
  DsmMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DsmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.qwertyuiop1995.dsmnativeclient.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DsmMobile:
    build:
      targets:
        DsmMobile: all
        DsmMobileTests: [test]
    test:
      targets:
        - DsmMobileTests
