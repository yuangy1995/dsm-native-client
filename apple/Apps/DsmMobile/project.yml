name: DsmMobile
options:
  bundleIdPrefix: io.github.qwertyuiop1995
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    LANSTASH_MOBILE_BUNDLE_ID: io.github.qwertyuiop1995.dsmnativeclient.mobile
    LANSTASH_MOBILE_APP_GROUP: group.io.github.qwertyuiop1995.dsmnativeclient.mobile
    LANSTASH_MOBILE_SHARED_KEYCHAIN_GROUP: "$(AppIdentifierPrefix)io.github.qwertyuiop1995.dsmnativeclient.mobile.shared"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DsmShared:
    path: ../..
targets:
  DsmMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - ExtensionShared
      - path: Resources
    dependencies:
      - package: DsmShared
        product: DsmLocalization
      - package: DsmShared
        product: DsmCore
      - package: DsmShared
        product: DsmNetwork
      - package: DsmShared
        product: DsmPhotosFeature
      - package: DsmShared
        product: DsmFileFeature
      - package: DsmShared
        product: DsmVirtualMachineConsoleFeature
      - target: DsmShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LANSTASH_MOBILE_BUNDLE_ID)"
        PRODUCT_NAME: DsmMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/DsmMobile.entitlements
  DsmShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - ExtensionShared
      - Sources/Session/MobileWorkspaceIdentity.swift
      - Sources/Features/Files/MobileFileUploadQueue.swift
      - path: Resources/en.lproj
      - path: Resources/zh-Hans.lproj
    dependencies:
      - package: DsmShared
        product: DsmLocalization
      - package: DsmShared
        product: DsmCore
      - package: DsmShared
        product: DsmNetwork
      - package: DsmShared
        product: DsmFileFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LANSTASH_MOBILE_BUNDLE_ID).share"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: SupportingFiles/DsmShare-Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/DsmMobileExtension.entitlements
  DsmMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DsmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LANSTASH_MOBILE_BUNDLE_ID).tests"
        GENERATE_INFOPLIST_FILE: YES
  DsmMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DsmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LANSTASH_MOBILE_BUNDLE_ID).uitests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DsmMobile
schemes:
  DsmMobile:
    build:
      targets:
        DsmMobile: all
        DsmMobileTests: [test]
        DsmMobileUITests: [test]
    test:
      targets:
        - DsmMobileTests
        - DsmMobileUITests
