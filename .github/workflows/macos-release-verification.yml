name: macOS Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XCODE_VERSION: "16.4"
  XCODE_DEVELOPER_DIR: "/Applications/Xcode_16.4.app/Contents/Developer"
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  LANSTASH_NOTARY_PROFILE: "lanstash-release-notary"

jobs:
  sign-notarize-and-verify:
    # 此环境应配置人工审批，以及仅供发布使用的证书和公证 Secrets。
    environment: macos-release
    runs-on: macos-15
    steps:
      - name: 检出仓库
        # v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 选择锁定的 Xcode 工具链
        shell: bash
        run: |
          test -d "$XCODE_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          installed_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          test "$installed_version" = "$XCODE_VERSION"
          xcodebuild -version
          swift --version

      - name: 安装并校验锁定的 XcodeGen
        shell: bash
        run: |
          xcodegen_archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          xcodegen_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl -fsSL --retry 3 \
            --output "$xcodegen_archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$xcodegen_archive" | shasum -a 256 -c -
          unzip -q "$xcodegen_archive" -d "$xcodegen_root"
          "$xcodegen_root/xcodegen/bin/xcodegen" --version
          test "$("$xcodegen_root/xcodegen/bin/xcodegen" --version | awk '{ print $2 }')" = "$XCODEGEN_VERSION"
          echo "$xcodegen_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: 运行共享包测试
        run: swift test --package-path apple

      - name: 校验发布凭据配置
        shell: bash
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_BASE64 }}
          MACOS_FILE_PROVIDER_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_FILE_PROVIDER_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          LANSTASH_MAC_APP_BUNDLE_ID: ${{ vars.MACOS_APP_BUNDLE_ID }}
          LANSTASH_MAC_FILE_PROVIDER_BUNDLE_ID: ${{ vars.MACOS_FILE_PROVIDER_BUNDLE_ID }}
          LANSTASH_MAC_APP_GROUP_ID: ${{ vars.MACOS_APP_GROUP_ID }}
          LANSTASH_SHARED_KEYCHAIN_SUFFIX: ${{ vars.MACOS_SHARED_KEYCHAIN_SUFFIX }}
        run: |
          for name in \
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 \
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD \
            MACOS_APP_PROVISIONING_PROFILE_BASE64 \
            MACOS_FILE_PROVIDER_PROVISIONING_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            LANSTASH_MAC_APP_BUNDLE_ID \
            LANSTASH_MAC_FILE_PROVIDER_BUNDLE_ID \
            LANSTASH_MAC_APP_GROUP_ID \
            LANSTASH_SHARED_KEYCHAIN_SUFFIX; do
            test -n "${!name:-}" || {
              echo "发布环境缺少必需 Secret 或 Variable：$name" >&2
              exit 1
            }
          done
          [[ "$LANSTASH_MAC_APP_GROUP_ID" == group.* \
            || "$LANSTASH_MAC_APP_GROUP_ID" =~ ^[A-Z0-9]{10}\. ]] || {
            echo "MACOS_APP_GROUP_ID 必须使用 group.* 或 <TeamID>.* 格式" >&2
            exit 1
          }

      - name: 导入临时 Developer ID 证书并配置 API Key 公证资料
        shell: bash
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_BASE64 }}
          MACOS_FILE_PROVIDER_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_FILE_PROVIDER_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          release_keychain="$RUNNER_TEMP/lanstash-release.keychain-db"
          certificate_path="$RUNNER_TEMP/lanstash-developer-id.p12"
          app_profile_path="$RUNNER_TEMP/lanstash-macos-app.provisionprofile"
          file_provider_profile_path="$RUNNER_TEMP/lanstash-file-provider.provisionprofile"
          api_key_path="$RUNNER_TEMP/lanstash-notary-api-key.p8"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$MACOS_APP_PROVISIONING_PROFILE_BASE64" | base64 -D > "$app_profile_path"
          printf '%s' "$MACOS_FILE_PROVIDER_PROVISIONING_PROFILE_BASE64" | base64 -D > "$file_provider_profile_path"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 \
            "$certificate_path" \
            "$app_profile_path" \
            "$file_provider_profile_path" \
            "$api_key_path"
          security create-keychain -p "$keychain_password" "$release_keychain"
          security set-keychain-settings -lut 21600 "$release_keychain"
          security unlock-keychain -p "$keychain_password" "$release_keychain"
          security import "$certificate_path" \
            -k "$release_keychain" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$release_keychain"
          security list-keychain -d user -s "$release_keychain"
          security default-keychain -s "$release_keychain"
          signing_identities="$(
            security find-identity -v -p codesigning "$release_keychain" \
              | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p'
          )"
          identity_count="$(printf '%s\n' "$signing_identities" | awk 'NF { count++ } END { print count + 0 }')"
          test "$identity_count" -eq 1 || {
            echo "Developer ID .p12 必须且只能包含一张 Developer ID Application 身份" >&2
            exit 1
          }
          echo "LANSTASH_SIGNING_IDENTITY=$signing_identities" >> "$GITHUB_ENV"
          xcrun notarytool history \
            --key "$api_key_path" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format json >/dev/null

      - name: 生成 macOS 工程
        working-directory: apple/Apps/DsmMac
        shell: bash
        run: |
          xcodegen generate
          git diff --exit-code -- DsmMac.xcodeproj/project.pbxproj

      - name: 构建、签名并生成候选包
        working-directory: apple/Apps/DsmMac
        env:
          LANSTASH_NON_INTERACTIVE: 1
          LANSTASH_BUILD_TYPE: Release
          LANSTASH_TARGET_ARCH: universal
          LANSTASH_RUN_AFTER_PACKAGE: 0
          LANSTASH_MAC_APP_BUNDLE_ID: ${{ vars.MACOS_APP_BUNDLE_ID }}
          LANSTASH_MAC_FILE_PROVIDER_BUNDLE_ID: ${{ vars.MACOS_FILE_PROVIDER_BUNDLE_ID }}
          LANSTASH_MAC_APP_GROUP_ID: ${{ vars.MACOS_APP_GROUP_ID }}
          LANSTASH_SHARED_KEYCHAIN_SUFFIX: ${{ vars.MACOS_SHARED_KEYCHAIN_SUFFIX }}
          LANSTASH_MAC_APP_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/lanstash-macos-app.provisionprofile
          LANSTASH_MAC_FILE_PROVIDER_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/lanstash-file-provider.provisionprofile
        run: ./package.sh

      - name: 公证、装订并验证正式候选包
        shell: bash
        env:
          LANSTASH_NOTARY_API_KEY_PATH: ${{ runner.temp }}/lanstash-notary-api-key.p8
          LANSTASH_NOTARY_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          LANSTASH_NOTARY_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          shopt -s nullglob
          dmg_paths=(apple/Apps/DsmMac/dist/LanStash-*.dmg)
          shopt -u nullglob
          test "${#dmg_paths[@]}" -eq 1
          apple/Apps/DsmMac/notarize.sh "${dmg_paths[0]}"

      - name: 上传已验证的正式候选包
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LanStash-macOS-release-verified
          path: |
            apple/Apps/DsmMac/dist/*.app
            apple/Apps/DsmMac/dist/*.dmg
          if-no-files-found: error

      - name: 清理临时发布钥匙串
        if: always()
        shell: bash
        run: |
          release_keychain="$RUNNER_TEMP/lanstash-release.keychain-db"
          certificate_path="$RUNNER_TEMP/lanstash-developer-id.p12"
          app_profile_path="$RUNNER_TEMP/lanstash-macos-app.provisionprofile"
          file_provider_profile_path="$RUNNER_TEMP/lanstash-file-provider.provisionprofile"
          api_key_path="$RUNNER_TEMP/lanstash-notary-api-key.p8"
          if [[ -f "$release_keychain" ]]; then
            security delete-keychain "$release_keychain"
          fi
          if [[ -f "$certificate_path" ]]; then
            /bin/rm -f -- "$certificate_path"
          fi
          if [[ -f "$app_profile_path" ]]; then
            /bin/rm -f -- "$app_profile_path"
          fi
          if [[ -f "$file_provider_profile_path" ]]; then
            /bin/rm -f -- "$file_provider_profile_path"
          fi
          if [[ -f "$api_key_path" ]]; then
            /bin/rm -f -- "$api_key_path"
          fi
