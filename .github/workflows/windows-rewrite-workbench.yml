name: Windows Rewrite Workbench
on:
  push:
    branches: [codex/windows-native-rebuild]
    paths: [.github/workflows/windows-rewrite-workbench.yml]
permissions:
  contents: write
jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 应用经过逐文件校验的源码变更
        id: patch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import subprocess, textwrap
          # Reuse the immutable, reviewed reconstruction script; only scope the whitespace check.
          raw = subprocess.check_output(['git', 'show', '893843de4f75d5e9bee2f284926aa0982d58b9a1:.github/workflows/windows-rewrite-workbench.yml']).decode('utf-8')
          script = textwrap.dedent(raw.split('        run: |\n', 1)[1].split('      - name: WinUI x64', 1)[0])
          assert script.count("git('diff', '--check')") == 1
          script = script.replace("git('diff', '--check')", "subprocess.run(['git', 'diff', '--check', '--', *sorted(seen)], check=True)")
          exec(compile(script, '<verified-native-source-patch>', 'exec'))
      - name: WinUI x64 编译
        working-directory: windows
        run: dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-x64
      - name: xUnit 回归
        if: ${{ always() && steps.patch.outcome == 'success' }}
        working-directory: windows
        run: dotnet test tests/LanStash.Tests/LanStash.Tests.csproj --configuration Release --logger 'trx;LogFileName=native-workspace.trx'
      - name: WinUI ARM64 编译
        if: ${{ always() && steps.patch.outcome == 'success' }}
        working-directory: windows
        run: dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-arm64
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-native-workspace-tests
          path: windows/tests/**/TestResults/*.trx
          retention-days: 3
