name: Windows Rewrite Workbench

on:
  push:
    branches: [codex/windows-native-rebuild]
    paths: [.github/workflows/windows-rewrite-workbench.yml]

permissions:
  contents: write

jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 应用已校验的 Windows 源码变更
        id: patch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          from xml.dom import minidom
          assert os.environ['GITHUB_REF_NAME'] == 'codex/windows-native-rebuild'
          assert os.environ['GITHUB_REPOSITORY'] == 'yuangy1995/dsm-native-client'
          shas = '''
          732fc85b838c067f02629d48e3281414b163709c
          3f692f4b8c2609897bb1258acec1479dc55c178d
          11ab7283d2310a50c632e6fabf6eaa262ab0fc35
          7dfe8311fe830d9e3a5afb086fb76573cf6346d7
          e3610b169253120269dbede4cc8214e69a3a2275
          babebff08519c96cfc44b35465e715604844bb44
          0e367f3d4ea2de6ca00a9aa24487c3b86d8eb223
          4abb0af1c34488dcd12b747ae5ef8656b2f6fa2a
          58a4f531f74258a39b0e51765cbfa3cc4e30a93b
          db35fa85e0101d17ae0369b8a5218b2a354cbfd9
          118dff49bd19e675dca0c4d031ea4eb5c300a27a
          d0b7ebfc22b1ce93fa4acbd8afcc2be5d9c2de76
          4df294e6aac19231782abf346701bd13ef3d3229
          d5373cea285e4c16d1c15ef7f8121ff32329e707
          f15f6fe7c324f70aeb07957ba694853d6e1716c1
          63f50e65eb1984557da14e9ab2054dcf65f9e5cd
          a6c6382a4ba585550c8ab827b9023be4a42bfc22
          2f2e489bd57880ff4e742cd89c1be7f96f818bfe
          fa26a027aca4131abc69770618064ff8aada3d24
          b7eb46804ddac28241972b8917afd07d8bf03ea0
          648bc00ef2535440df566cf5bcdc2d879cc3c23c
          78b9731de3652d59fea18a779d628f68382fa990
          66cb501a787181b9120b0c6f9581e3f2b6b0855e
          8f6b4cfa72e22f3a5d7f562d2276d38fe3cd0a76
          1ae507a644698353a09f358413f12045f7c9a1bc
          9a995b035b06332ce50dcc92296711e55483b4be
          b83dfaf01d724edbd2395cea39fe53657ea72774
          50e38bdd8c5df454ddab0bcf5e5275c8c4441f56
          a59b471288396c186584662f660416ca7272d69f
          e1cbeebb9dfda7a97302ee1c4368eb8376b7ec25
          e4e8d075b8994a8462407852f467b98a8fe91d5d
          afcc3623bf9e58052771ef0d1afaf9b239c20a0e
          359eb3844776a9e24ce373927f9c1742fc401108
          bfa977a2ae6d926de4c961aab267ed5f158a6443
          27042c84c2d9fd3fb8b26638e4fb8186e8a1fdf0
          d5c6041a1ba27c1c920e80e2f62da8471e290316
          1153487a58469c1ce9b96ad55f31e532b4cbf142
          267942335397bfd4c32e193837f255adfc0355c8
          870c696d4416ab626c81bff2e1bf75f2b35cd36b
          1d2b08f6ece6cf5c4ccd5c31fb4d6dac43c44781
          '''.split()
          payload = bytearray()
          for sha in shas:
              url = f'https://api.github.com/repos/yuangy1995/dsm-native-client/git/blobs/{sha}'
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'native-workspace-validation'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              payload.extend(data)
          assert hashlib.sha256(payload).hexdigest() == 'd02b68c5d6db2fd0cb59bfb49dd3945a9c14b926e93579203e1603c998b117da'
          manifest = json.loads(lzma.decompress(payload))
          assert manifest['version'] == 2
          def git(*args):
              return subprocess.check_output(['git', *args])
          def normalize_xaml(text):
              doc = minidom.parseString(text.encode('utf-8'))
              def strip(node):
                  for child in list(node.childNodes):
                      if child.nodeType == child.TEXT_NODE and not child.data.strip():
                          node.removeChild(child)
                      elif child.hasChildNodes():
                          strip(child)
              strip(doc)
              return doc.toprettyxml(indent='    ', encoding='utf-8').decode('utf-8')
          prepared = []
          seen = set()
          for entry in manifest['files']:
              name = entry['path']
              path = pathlib.PurePosixPath(name)
              assert name.startswith('windows/') and not path.is_absolute() and '..' not in path.parts and '\\' not in name
              assert name not in seen
              seen.add(name)
              disk = pathlib.Path(name)
              assert not any(parent.is_symlink() for parent in [disk, *disk.parents])
              tracked = bool(git('ls-files', '--', name).strip())
              current = git('rev-parse', 'HEAD:' + name).decode().strip() if tracked else None
              assert current == entry['old'], '并发变更，停止：' + name
              if not tracked:
                  assert not disk.exists()
              if entry.get('delete'):
                  prepared.append((disk, None))
                  continue
              text = git('cat-file', 'blob', entry['source']).decode('utf-8').replace('\r\n', '\n') if entry['source'] else ''
              if entry.get('normalize_xaml') and text:
                  text = normalize_xaml(text)
              lines = text.splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              output = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['sha256'], name
              prepared.append((disk, output))
          for disk, output in prepared:
              if output is None:
                  disk.unlink()
              else:
                  disk.parent.mkdir(parents=True, exist_ok=True)
                  disk.write_bytes(output)
          git('config', 'core.autocrlf', 'false')
          git('diff', '--check')
          git('add', '--', *sorted(seen))
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat(windows): rebuild native workspace and bound file presentation work')
          git('push', 'origin', 'HEAD:refs/heads/codex/windows-native-rebuild')
          print('Validated and committed', len(prepared), 'Windows files:', git('rev-parse', 'HEAD').decode().strip())
      - name: WinUI x64 编译
        working-directory: windows
        run: dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-x64
      - name: xUnit 回归
        if: ${{ always() && steps.patch.outcome == 'success' }}
        working-directory: windows
        run: dotnet test tests/LanStash.Tests/LanStash.Tests.csproj --configuration Release --logger 'trx;LogFileName=native-workspace.trx'
      - name: WinUI ARM64 编译
        if: ${{ always() && steps.patch.outcome == 'success' }}
        working-directory: windows
        run: dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-arm64
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-native-workspace-tests
          path: windows/tests/**/TestResults/*.trx
          retention-days: 3
