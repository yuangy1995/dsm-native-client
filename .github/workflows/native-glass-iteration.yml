name: Native glass implementation validation
on:
  push:
    branches: [codex/native-glass-photos-validation]
    paths: [.github/native-glass-input.json]
permissions:
  contents: read
concurrency:
  group: native-glass-implementation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      targets: ${{ steps.import.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Import and verify reviewed source edits
        id: import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, lzma, os, pathlib, re, subprocess, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'yuangy1995/dsm-native-client'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/native-glass-photos-validation'
          data = json.loads(pathlib.Path('.github/native-glass-input.json').read_text())
          for key in ('tree', 'baseline', 'expected_head'):
              assert re.fullmatch('[0-9a-f]{40}', data[key]), key
          assert data['baseline'] == '2243e731000382e5ff8bf2460c1ee7f9b83d0f11'
          source_base = data.get('source_base', data['baseline'])
          assert source_base in (data['baseline'], data['expected_head'])
          assert set(data['targets']) <= {'apple', 'android', 'windows'}
          target = 'refs/heads/codex/native-glass-photos-parity'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', target], text=True).split()[0]
          assert remote == data['expected_head'], 'Feature branch changed; refuse to overwrite it'
          blob_ids = data.get('payload_blobs', [data.get('payload_blob')])
          assert 1 <= len(blob_ids) <= 32
          compressed = b''
          for blob_id in blob_ids:
              assert re.fullmatch('[0-9a-f]{40}', blob_id)
              request = urllib.request.Request('https://api.github.com/repos/yuangy1995/dsm-native-client/git/blobs/' + blob_id, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              compressed += base64.b64decode(blob['content'])
              assert len(compressed) < 10_000_000
          assert hashlib.sha256(compressed).hexdigest() == data['payload_sha256']
          compression = data.get('compression', 'gzip')
          assert compression in ('gzip', 'xz')
          payload = json.loads(lzma.decompress(compressed) if compression == 'xz' else gzip.decompress(compressed))
          assert payload['version'] == 1
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-input.json').write_text(json.dumps(data))
          subprocess.run(['git', 'read-tree', '--reset', '-u', source_base], check=True)
          def git_hash(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          seen = set()
          for entry in payload['entries']:
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert str(path) not in seen
              seen.add(str(path))
              assert not path.is_symlink() and not any(parent.is_symlink() for parent in path.parents)
              before = path.read_bytes() if path.exists() else None
              assert (git_hash(before) if before is not None else None) == entry['base'], str(path)
              if entry['sha'] is None:
                  path.unlink()
                  continue
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              previous_end = 0
              for edit in entry['edits']:
                  assert previous_end <= edit['start'] <= edit['end'] <= len(lines)
                  previous_end = edit['end']
              for edit in reversed(entry['edits']):
                  lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert git_hash(after) == entry['sha'], str(path)
              assert entry['mode'] in ('100644', '100755')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
              path.chmod(int(entry['mode'][-3:], 8))
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == data['tree'], (tree, data['tree'])
          subprocess.run(['git', 'diff', '--exit-code', data['baseline'], tree, '--', 'apple/Apps/DsmMac'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(data['targets']) + '\n')
          PY
      - name: Generate the mobile project with the pinned generator
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          cd apple/Apps/DsmMobile
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate
      - name: Publish only the isolated feature branch
        id: publish
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          data = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-input.json').read_text())
          target = 'refs/heads/codex/native-glass-photos-parity'
          subprocess.run(['git', 'add', 'apple/Apps/DsmMobile/DsmMobile.xcodeproj/project.pbxproj'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'codex'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'codex@users.noreply.github.com'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          message = data.get('message', 'feat(native): align Photos and native glass with the macOS baseline')
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', data['baseline']], input=message + '\n', text=True).strip()
          subprocess.run(['git', 'push', '--force-with-lease=' + target + ':' + data['expected_head'], 'origin', commit + ':' + target], check=True)
          generated = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-generated'
          generated.mkdir()
          shutil.copy('apple/Apps/DsmMobile/DsmMobile.xcodeproj/project.pbxproj', generated / 'DsmMobile.pbxproj')
          (generated / 'source-report.json').write_text(json.dumps({'source_sha': commit, 'tree': tree, 'requested_tree': data['tree'], 'baseline': data['baseline']}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_sha=' + commit + '\n')
          print('Published source:', commit)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-generated
          path: ${{ runner.temp }}/native-generated
          retention-days: 3
  apple-modern:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.targets), 'apple')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the actual iOS 27 SDK and compile app and tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/native-logs"
          xcodebuild -version | tee "$RUNNER_TEMP/native-logs/toolchain.txt"
          xcodebuild -showsdks >> "$RUNNER_TEMP/native-logs/toolchain.txt"
          xcodebuild -version | head -1 | grep -E '^Xcode 27\.'
          xcodebuild -project apple/Apps/DsmMobile/DsmMobile.xcodeproj -scheme DsmMobile -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/mobile-derived" CODE_SIGNING_ALLOWED=NO build-for-testing > "$RUNNER_TEMP/native-logs/mobile-modern.log" 2>&1 || { tail -180 "$RUNNER_TEMP/native-logs/mobile-modern.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-apple-modern-logs
          path: ${{ runner.temp }}/native-logs
          retention-days: 3
  apple-baseline:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.targets), 'apple')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Compile the compatibility branch
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/native-logs"
          xcodebuild -version | tee "$RUNNER_TEMP/native-logs/toolchain.txt"
          xcodebuild -project apple/Apps/DsmMobile/DsmMobile.xcodeproj -scheme DsmMobile -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/mobile-derived" CODE_SIGNING_ALLOWED=NO build-for-testing > "$RUNNER_TEMP/native-logs/mobile-baseline.log" 2>&1 || { tail -180 "$RUNNER_TEMP/native-logs/mobile-baseline.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-apple-baseline-logs
          path: ${{ runner.temp }}/native-logs
          retention-days: 3
  apple-shared:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.targets), 'apple')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Run shared Mac regressions independently of mobile compilation
        run: |
          mkdir -p "$RUNNER_TEMP/native-logs"
          swift test --package-path apple > "$RUNNER_TEMP/native-logs/shared-tests.log" 2>&1 || { tail -180 "$RUNNER_TEMP/native-logs/shared-tests.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-apple-shared-logs
          path: ${{ runner.temp }}/native-logs
          retention-days: 3
  android:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.targets), 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile and test Android
        working-directory: android
        run: |
          mkdir -p "$RUNNER_TEMP/native-logs"
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:minifyReleaseWithR8 :app:assembleDebugAndroidTest :app:lintDebug --no-parallel --stacktrace > "$RUNNER_TEMP/native-logs/android.log" 2>&1 || { tail -220 "$RUNNER_TEMP/native-logs/android.log"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-android-validation
          path: |
            ${{ runner.temp }}/native-logs
            android/app/build/reports
            android/app/build/outputs/apk
          retention-days: 3
  windows:
    needs: prepare
    if: contains(fromJSON(needs.prepare.outputs.targets), 'windows')
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore and validate native Windows
        working-directory: windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/native-logs" | Out-Null
          dotnet restore LanStash.slnx *> "$env:RUNNER_TEMP/native-logs/restore.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/native-logs/restore.log" -Tail 160; exit 1 }
          dotnet test tests/LanStash.Tests/LanStash.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=native.trx" --blame-hang --blame-hang-timeout 2m *> "$env:RUNNER_TEMP/native-logs/tests.log"
          $testResult = $LASTEXITCODE
          dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-x64 --no-restore *> "$env:RUNNER_TEMP/native-logs/x64.log"
          $x64Result = $LASTEXITCODE
          dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-arm64 --no-restore *> "$env:RUNNER_TEMP/native-logs/arm64.log"
          $armResult = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/native-logs/tests.log" -Tail 100
          Get-Content "$env:RUNNER_TEMP/native-logs/x64.log" -Tail 100
          Get-Content "$env:RUNNER_TEMP/native-logs/arm64.log" -Tail 100
          if ($testResult -ne 0 -or $x64Result -ne 0 -or $armResult -ne 0) { exit 1 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-windows-validation
          path: |
            ${{ runner.temp }}/native-logs
            windows/tests/LanStash.Tests/TestResults
          retention-days: 3
