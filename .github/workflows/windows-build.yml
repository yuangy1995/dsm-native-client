name: Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 恢复依赖
        working-directory: windows
        run: dotnet restore LanStash.slnx

      - name: 运行测试
        timeout-minutes: 10
        working-directory: windows
        run: >-
          dotnet test tests/LanStash.Tests/LanStash.Tests.csproj
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"
          --blame-hang
          --blame-hang-timeout 2m

      - name: 构建 WinUI x64
        working-directory: windows
        run: dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-x64 --no-restore

      - name: 构建 WinUI ARM64
        working-directory: windows
        run: dotnet build src/LanStash.App/LanStash.App.csproj --configuration Release --runtime win-arm64 --no-restore
