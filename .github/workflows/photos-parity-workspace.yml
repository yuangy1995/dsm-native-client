name: Photos Parity Workspace
on:
  push:
    branches: [codex/photos-parity-complete-20260915]
    paths: [.github/workflows/photos-parity-workspace.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.patch.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 应用照片回归和编译修正
        id: patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/photos-parity-complete-20260915
          test "$GITHUB_REF_NAME" = "$branch"
          test "$(git rev-parse HEAD^)" = 2a63e5bca55816cf7d3a8a5c05c603b455d0d829
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          for blob in 14d7c077132db589281b4e5e3d5a6479f54beacc b3dec8bc9dab6ab6a5ecef14a2178a50b092a82e; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | base64 --decode >> "$RUNNER_TEMP/photos.patch.xz"
          done
          python3 - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((root / 'photos.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '09c5bb83fd78ac82de3189f43b29da321947277f1be0b37984e62628b764e78d'
          (root / 'photos.patch').write_bytes(patch)
          PY
          git apply --index "$RUNNER_TEMP/photos.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(photos): exercise Android paging, filters and bounded media transport'
          git push origin "HEAD:refs/heads/$branch"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  android:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 编译并验证 Android 照片模块
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug --no-parallel --stacktrace 2>&1 | tee "$RUNNER_TEMP/photos-android-build.log"
      - name: 保存构建与回归证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-android-validation
          path: |
            ${{ runner.temp }}/photos-android-build.log
            android/app/build/test-results
            android/app/build/reports
            android/app/build/outputs/apk/debug
          retention-days: 1
