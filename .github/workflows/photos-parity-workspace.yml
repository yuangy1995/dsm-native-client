name: Photos Parity Workspace
on:
  push:
    branches: [codex/photos-parity-complete-20260915]
    paths: [.github/workflows/photos-parity-workspace.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.patch.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 应用 Android 原生图库变更
        id: patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=codex/photos-parity-complete-20260915
          test "$GITHUB_REF_NAME" = "$branch"
          test "$(git rev-parse HEAD^)" = 2f8b2cddd4f4ee420ed2aeb5ae6e9086abfdcf0e
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          for blob in d1694dc907dd1fcf2a1345b94377a42842fb4860 0c659d31565c6fabbc800b95e85386adc5106d64 8d4f6deea74948aa1d20a358079329a48c9b18c0 21394a4da0d1860395f60bbc5baa8ebb28dee21c df2333a554d0565864616ca5c25c23dcc0682b87; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | base64 --decode >> "$RUNNER_TEMP/photos.patch.xz"
          done
          python3 - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((root / 'photos.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '5c06c6d2d04bd032dd1b8d02d953db59c40ef75192d977e5eb0e4af421176aba'
          (root / 'photos.patch').write_bytes(patch)
          PY
          git apply --index "$RUNNER_TEMP/photos.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(photos): connect Android to the native Synology Photos library'
          git push origin "HEAD:refs/heads/$branch"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  android:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: 编译并验证 Android 照片模块
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-parallel --stacktrace 2>&1 | tee "$RUNNER_TEMP/photos-android-build.log"
      - name: 保存构建与回归证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photos-android-validation
          path: |
            ${{ runner.temp }}/photos-android-build.log
            android/app/build/test-results
            android/app/build/reports
            android/app/build/outputs/apk/debug
          retention-days: 1
