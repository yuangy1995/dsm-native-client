name: Photos Parity Finish
on:
  push:
    branches: [codex/photos-parity-integrated-20260915]
    paths: [.github/workflows/photos-parity-finish.yml]
permissions:
  contents: write
  actions: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/photos-parity-integrated-20260915
      - name: 保持删除次数断言并修正分析器要求
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('windows/tests/LanStash.Tests/Photos/SynologyPhotosRepositoryTests.cs')
          text = p.read_text()
          before = 'Assert.Single(fixture.Requests.Where(call => call.Method == "delete"))'
          after = 'Assert.Single(fixture.Requests, call => call.Method == "delete")'
          assert text.count(before) == 2
          p.write_text(text.replace(before, after))
          PY
          git diff --check
          git add windows/tests/LanStash.Tests/Photos/SynologyPhotosRepositoryTests.cs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(photos): preserve exact single deletion assertions with analyzer-compatible overload'
          git push origin HEAD:refs/heads/codex/photos-parity-integrated-20260915
          gh workflow run windows-build.yml --ref codex/photos-parity-integrated-20260915
