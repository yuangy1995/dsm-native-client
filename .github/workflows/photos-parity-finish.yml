name: Photos Parity Finish
on:
  push:
    branches: [codex/photos-parity-integrated-20260915]
    paths: [.github/workflows/photos-parity-finish.yml]
permissions:
  contents: write
  actions: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/photos-parity-integrated-20260915
      - name: 应用已保存并校验摘要的照片修复
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/211c63cb8aa429b5f985df79ed5193b88d173e7f" --jq .content | base64 -d > "$RUNNER_TEMP/review.patch.xz"
          xz -dc "$RUNNER_TEMP/review.patch.xz" > "$RUNNER_TEMP/review.patch"
          echo "e7269349be39d3e4af5134d1d4bb4e5a7ad843a3714cc5b4f78de78bc4eb7bc4  $RUNNER_TEMP/review.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(photos): close session races and verify native Windows media and filters'
          git push origin HEAD:refs/heads/codex/photos-parity-integrated-20260915
      - name: 导出无凭据源码与对比基线
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/photos-review"
          git fetch --depth=1 origin main
          git archive --format=zip HEAD > "$RUNNER_TEMP/photos-review/integrated.zip"
          git archive --format=zip FETCH_HEAD > "$RUNNER_TEMP/photos-review/main.zip"
          printf 'integrated %s\nmain %s\n' "$(git rev-parse HEAD)" "$(git rev-parse FETCH_HEAD)" > "$RUNNER_TEMP/photos-review/manifest.txt"
          git diff FETCH_HEAD HEAD > "$RUNNER_TEMP/photos-review/main-to-integrated.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: photos-parity-final-review
          path: ${{ runner.temp }}/photos-review/
          retention-days: 3
          if-no-files-found: error
      - name: 执行现有平台和仓库门禁
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in android-build.yml windows-build.yml repository-check.yml; do
            gh workflow run "$workflow" --ref codex/photos-parity-integrated-20260915
          done
