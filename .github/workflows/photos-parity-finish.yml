name: Photos Parity Finish
on:
  push:
    branches: [codex/photos-parity-integrated-20260915]
    paths: [.github/workflows/photos-parity-finish.yml]
permissions:
  contents: write
  actions: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/photos-parity-integrated-20260915
      - name: 合并照片账本并同步平台计划和兼容证据边界
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/0ff7ac75337d36033b4b77dc0271cc6de916ac03" --jq .content | base64 -d > "$RUNNER_TEMP/docs.py.xz"
          xz -dc "$RUNNER_TEMP/docs.py.xz" > "$RUNNER_TEMP/docs.py"
          echo "3d546ddcc7275d24ac3fd85b6ea3a2e364b24a8426001ed663f604ae175b486c  $RUNNER_TEMP/docs.py" | sha256sum -c -
          python3 "$RUNNER_TEMP/docs.py"
          python3 tools/codex/check_documentation.py --strict-release
          git diff --check
          git add README.md README.en.md docs/
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(photos): consolidate native parity scope, performance boundaries and device validation'
          git push origin HEAD:refs/heads/codex/photos-parity-integrated-20260915
          gh workflow run repository-check.yml --ref codex/photos-parity-integrated-20260915
