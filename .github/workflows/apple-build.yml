name: Apple Build

on:
  workflow_dispatch:
  push:
    paths:
      - "apple/**"
      - ".github/workflows/apple-build.yml"
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple-build.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 运行共享包测试
        run: swift test --package-path apple

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 iPhone 与 iPad 工程
        working-directory: apple/Apps/DsmMobile
        run: xcodegen generate

      - name: 构建 iPhone 与 iPad 通用应用
        working-directory: apple/Apps/DsmMobile
        run: >-
          xcodebuild
          -project DsmMobile.xcodeproj
          -scheme DsmMobile
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

      - name: 打包 macOS 应用
        working-directory: apple/Apps/DsmMac
        env:
          LANSTASH_NON_INTERACTIVE: 1
          LANSTASH_BUILD_TYPE: Release
          LANSTASH_TARGET_ARCH: native
          LANSTASH_RUN_AFTER_PACKAGE: 0
        run: ./package.sh

      - name: 上传打包产物
        uses: actions/upload-artifact@v7
        with:
          name: LanStash-macOS
          path: |
            apple/Apps/DsmMac/dist/*.app
            apple/Apps/DsmMac/dist/*.dmg
          if-no-files-found: error
