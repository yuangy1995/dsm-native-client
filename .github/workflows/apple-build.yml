name: Apple Build

on:
  workflow_dispatch:
  push:
    # 标签由正式发布流程验收，避免重复启动整轮移动测试并占用发布执行资源。
    branches:
      - "**"
    paths:
      - "apple/**"
      - "tools/release/**"
      - ".github/workflows/apple-build.yml"
  pull_request:
    paths:
      - "apple/**"
      - "tools/release/**"
      - ".github/workflows/apple-build.yml"

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"
  XCODE_BUILD_VERSION: "17F113"
  XCODE_DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-target:
    name: ${{ matrix.target }}
    runs-on: macos-26
    # 模块组包含独立启动的 Files 系统用例，完整回归须留出系统初始化时间。
    timeout-minutes: ${{ matrix.target == 'shared-macos' && 120 || matrix.suite == 'modules' && 360 || 300 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: shared-macos
          - target: iPhone-workspace
            family: iPhone
            suite: workspace
          - target: iPhone-modules
            family: iPhone
            suite: modules
          - target: iPhone-administration
            family: iPhone
            suite: administration
          - target: iPhone-services
            family: iPhone
            suite: services
          - target: iPad-workspace
            family: iPad
            suite: workspace
          - target: iPad-modules
            family: iPad
            suite: modules
          - target: iPad-administration
            family: iPad
            suite: administration
          - target: iPad-services
            family: iPad
            suite: services
    steps:
      - name: 检出仓库
        # v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 选择锁定的 Xcode 工具链
        shell: bash
        run: |
          test -d "$XCODE_DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$XCODE_DEVELOPER_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          installed_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          test "$installed_version" = "$XCODE_VERSION"
          installed_build="$(xcodebuild -version | awk 'NR == 2 { print $3 }')"
          test "$installed_build" = "$XCODE_BUILD_VERSION"
          xcodebuild -version
          swift --version

      - name: 运行共享包测试
        if: matrix.target == 'shared-macos'
        run: swift test --package-path apple

      - name: 运行 macOS 发布与升级签名回归
        if: matrix.target == 'shared-macos'
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: 安装并校验锁定的 XcodeGen
        shell: bash
        run: |
          xcodegen_archive="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION.zip"
          xcodegen_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl -fsSL --retry 3 \
            --output "$xcodegen_archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$xcodegen_archive" | shasum -a 256 -c -
          unzip -q "$xcodegen_archive" -d "$xcodegen_root"
          "$xcodegen_root/xcodegen/bin/xcodegen" --version
          test "$("$xcodegen_root/xcodegen/bin/xcodegen" --version | awk '{ print $2 }')" = "$XCODEGEN_VERSION"
          echo "$xcodegen_root/xcodegen/bin" >> "$GITHUB_PATH"

      - name: 校验正式发布门禁脚本入口
        if: matrix.target == 'shared-macos'
        shell: bash
        run: |
          bash -n tools/release/verify_macos_distribution.sh
          bash -n tools/release/verify_macos_unsigned_ci_artifact.sh
          bash -n tools/release/verify_macos_updater.sh
          bash -n tools/release/publish_macos_release.sh
          if tools/release/verify_macos_distribution.sh; then
            echo "正式发布门禁不应在缺少候选产物时通过。" >&2
            exit 1
          else
            formal_gate_exit=$?
            test "$formal_gate_exit" -eq 2
          fi

      - name: 生成 iPhone 与 iPad 工程
        if: matrix.target != 'shared-macos'
        working-directory: apple/Apps/DsmMobile
        run: |
          xcodegen generate
          git diff --exit-code -- DsmMobile.xcodeproj/project.pbxproj

      - name: 生成 macOS 工程并校验生成物
        if: matrix.target == 'shared-macos'
        working-directory: apple/Apps/DsmMac
        shell: bash
        run: |
          xcodegen generate
          git diff --exit-code -- DsmMac.xcodeproj/project.pbxproj

      - name: 选择并启动当前 Xcode 的移动模拟器
        if: matrix.target != 'shared-macos'
        shell: bash
        env:
          MOBILE_FAMILY: ${{ matrix.family }}
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/mobile-simulators.json"
          python3 - "$RUNNER_TEMP/mobile-simulators.json" "$MOBILE_FAMILY" >> "$GITHUB_ENV" <<'PYTHON'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          family = sys.argv[2]
          candidates = []
          preferred = {"iPhone": "iPhone 17 Pro", "iPad": "iPad Air 11-inch (M4)"}
          for runtime, devices in data["devices"].items():
              match = re.search(r"\.iOS-(\d+(?:-\d+)*)$", runtime)
              if not match:
                  continue
              version = tuple(map(int, match[1].split("-")))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith(family):
                      candidates.append((version, device["name"] == preferred[family], device["name"], device["udid"], device["deviceTypeIdentifier"], runtime))
          if not candidates:
              raise SystemExit(f"缺少 {family} 可用模拟器，不能跳过移动端测试")
          version, _, name, device, device_type, runtime_id = max(candidates)
          print(f"MOBILE_DEVICE={device}")
          print(f"MOBILE_DEVICE_NAME={name}")
          print(f"MOBILE_DEVICE_TYPE={device_type}")
          print(f"MOBILE_RUNTIME_ID={runtime_id}")
          print(f"MOBILE_RUNTIME={'.'.join(map(str, version))}")
          PYTHON

      - name: 构建移动应用与全部测试
        if: matrix.target != 'shared-macos'
        working-directory: apple/Apps/DsmMobile
        shell: bash
        run: |
          echo "Testing $MOBILE_DEVICE_NAME on iOS $MOBILE_RUNTIME"
          xcrun simctl bootstatus "$MOBILE_DEVICE" -b
          # 测试宿主临时签名仅用于模拟器钥匙串；不改变正式签名或权限文件。
          xcodebuild build-for-testing \
            -project DsmMobile.xcodeproj -scheme DsmMobile \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$MOBILE_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/DsmMobile-build" -jobs 3 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-

      - name: 分组运行全部移动单元与界面回归
        if: matrix.target != 'shared-macos'
        working-directory: apple/Apps/DsmMobile
        shell: bash
        env:
          MOBILE_TARGET: ${{ matrix.target }}
          MOBILE_SUITE: ${{ matrix.suite }}
        run: |
          # 每台设备四组互补覆盖全部测试；服务设置单独运行，避免已发生的六小时超时。
          set -o pipefail
          administration_tests=(
            MobileDDNSUITests MobileDirectoryUITests MobileNasReadUITests MobileNasStorageUITests
            MobilePackageCenterUITests MobilePackageControlUITests MobilePackageInstallationUITests MobileRegionUITests
            MobileScheduledTasksUITests MobileSystemActionsUITests
          )
          system_tests=(MobileFilesProviderUITests MobileShareExtensionUITests MobileTransferBackgroundUITests)
          case "$MOBILE_SUITE" in
            workspace)
              test_selection=(-only-testing:DsmMobileUITests/MobileWorkspaceUITests)
              ;;
            modules)
              test_selection=(-only-testing:DsmMobileTests -only-testing:DsmMobileUITests -skip-testing:DsmMobileUITests/MobileWorkspaceUITests -skip-testing:DsmMobileUITests/MobileServiceSettingsUITests)
              for test_class in "${administration_tests[@]}"; do
                test_selection+=("-skip-testing:DsmMobileUITests/$test_class")
              done
              for test_class in "${system_tests[@]}"; do
                test_selection+=("-skip-testing:DsmMobileUITests/$test_class")
              done
              ;;
            services)
              test_selection=(-only-testing:DsmMobileUITests/MobileServiceSettingsUITests)
              ;;
            administration)
              test_selection=()
              for test_class in "${administration_tests[@]}"; do
                test_selection+=("-only-testing:DsmMobileUITests/$test_class")
              done
              ;;
            *) echo "未知移动测试分组：$MOBILE_SUITE" >&2; exit 1 ;;
          esac
          test_arguments=(
            test-without-building -project DsmMobile.xcodeproj -scheme DsmMobile
            -derivedDataPath "$RUNNER_TEMP/DsmMobile-build" -parallel-testing-enabled NO
          )
          capture_diagnostics=(
            python3 "$GITHUB_WORKSPACE/tools/release/capture_apple_ui_hangs.py"
            --output "$RUNNER_TEMP/DsmMobile-$MOBILE_TARGET-diagnostics"
          )
          system_result=0
          if [[ "$MOBILE_SUITE" == modules ]]; then
            # Files 服务曾晚于安装登记才发现扩展；只读等待实际提供器，不重试产品添加。
            mobile_app="$RUNNER_TEMP/DsmMobile-build/Build/Products/Debug-iphonesimulator/DsmMobile.app"
            files_bundle_id=$(python3 -c 'import plistlib, sys; print(plistlib.load(open(sys.argv[1], "rb"))["CFBundleIdentifier"])' "$mobile_app/PlugIns/DsmFiles.appex/Info.plist")
            xcrun simctl install "$MOBILE_DEVICE" "$mobile_app"
            files_tests=$(python3 - "$GITHUB_WORKSPACE/apple/Apps/DsmMobile/UITests/MobileFilesProviderUITests.swift" <<'PYTHON'
          import re
          import sys
          from pathlib import Path
          names = re.findall(r"\bfunc\s+(test\w+)\s*\(\s*\)", Path(sys.argv[1]).read_text())
          if not names or len(names) != len(set(names)):
              raise SystemExit("Files 系统用例列表为空或重复，不能跳过验证")
          print("\n".join(names))
          PYTHON
            )
            files_index=0
            files_device=""
            xcrun simctl shutdown "$MOBILE_DEVICE"
            cleanup_files_device() {
              if [[ -n "$files_device" ]]; then
                xcrun simctl shutdown "$files_device" >/dev/null 2>&1 || true
                xcrun simctl delete "$files_device" || true
              fi
            }
            trap cleanup_files_device EXIT
            while IFS= read -r test_name; do
              files_index=$((files_index + 1))
              # 每例新建同型号/运行时设备，不继承选择器缓存或克隆模板中的系统索引数据库。
              files_device=$(xcrun simctl create "LanStash-$MOBILE_TARGET-files-$files_index" "$MOBILE_DEVICE_TYPE" "$MOBILE_RUNTIME_ID")
              test -n "$files_device"
              xcrun simctl bootstatus "$files_device" -b
              xcrun simctl install "$files_device" "$mobile_app"
              files_discovered=false
              for attempt in {1..60}; do
                discovered=$(xcrun simctl spawn "$files_device" fileproviderctl dump "$files_bundle_id")
                if printf '%s\n' "$discovered" | grep -Fx "$files_bundle_id" >/dev/null; then
                  files_discovered=true
                  break
                fi
                sleep 2
              done
              if [[ "$files_discovered" != true ]]; then
                echo "系统尚未发现 Files 扩展，当前用例未执行：$test_name" >&2
                if [[ "$system_result" -eq 0 ]]; then system_result=1; fi
              else
                xcodebuild "${test_arguments[@]}" -destination "platform=iOS Simulator,id=$files_device" \
                  -resultBundlePath "$RUNNER_TEMP/DsmMobile-$MOBILE_TARGET-system-files-$files_index.xcresult" \
                  "-only-testing:DsmMobileUITests/MobileFilesProviderUITests/$test_name" \
                  2>&1 | "${capture_diagnostics[@]}" --device "$files_device" || {
                    failed_result=$?
                    if [[ "$system_result" -eq 0 ]]; then system_result=$failed_result; fi
                  }
              fi
              # 用例仍须自行完成域清理；独立结果封存后只回收本例新建的模拟器。
              xcrun simctl shutdown "$files_device"
              xcrun simctl delete "$files_device"
              files_device=""
            done <<< "$files_tests"
            trap - EXIT
            xcrun simctl bootstatus "$MOBILE_DEVICE" -b
            # 其余系统用例独立封存结果，Files 失败不能省略分享和后台回归。
            system_selection=()
            for test_class in "${system_tests[@]}"; do
              if [[ "$test_class" != MobileFilesProviderUITests ]]; then
                system_selection+=("-only-testing:DsmMobileUITests/$test_class")
              fi
            done
            xcodebuild "${test_arguments[@]}" -destination "platform=iOS Simulator,id=$MOBILE_DEVICE" \
              -resultBundlePath "$RUNNER_TEMP/DsmMobile-$MOBILE_TARGET-system.xcresult" \
              "${system_selection[@]}" 2>&1 | "${capture_diagnostics[@]}" --device "$MOBILE_DEVICE" || {
                failed_result=$?
                if [[ "$system_result" -eq 0 ]]; then system_result=$failed_result; fi
              }
          fi
          suite_result=0
          xcodebuild "${test_arguments[@]}" -destination "platform=iOS Simulator,id=$MOBILE_DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/DsmMobile-$MOBILE_TARGET.xcresult" \
            "${test_selection[@]}" 2>&1 | "${capture_diagnostics[@]}" --device "$MOBILE_DEVICE" || suite_result=$?
          # 首段失败仍运行余下测试，两段任一失败均保留失败退出码。
          if [[ "$system_result" -ne 0 ]]; then exit "$system_result"; fi
          exit "$suite_result"

      - name: 上传移动端测试结果
        if: always() && matrix.target != 'shared-macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LanStash-Apple-mobile-tests-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/DsmMobile-*.xcresult
            ${{ runner.temp }}/DsmMobile-*-diagnostics
          if-no-files-found: warn

      - name: 打包 macOS 应用
        if: matrix.target == 'shared-macos'
        working-directory: apple/Apps/DsmMac
        env:
          LANSTASH_NON_INTERACTIVE: 1
          LANSTASH_BUILD_TYPE: Release
          LANSTASH_TARGET_ARCH: native
          LANSTASH_RUN_AFTER_PACKAGE: 0
        run: ./package.sh

      - name: 校验临时签名 macOS 产物
        if: matrix.target == 'shared-macos'
        shell: bash
        run: |
          shopt -s nullglob
          dmg_paths=(apple/Apps/DsmMac/dist/local-test/LanStash-*.dmg)
          shopt -u nullglob
          test "${#dmg_paths[@]}" -eq 1
          tools/release/verify_macos_unsigned_ci_artifact.sh \
            "apple/Apps/DsmMac/dist/local-test/LanStash Test.app" \
            "${dmg_paths[0]}" \
            "$GITHUB_SHA"

      - name: 上传打包产物
        if: matrix.target == 'shared-macos'
        # v7.0.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LanStash-macOS
          path: |
            apple/Apps/DsmMac/dist/local-test/*.app
            apple/Apps/DsmMac/dist/local-test/*.dmg
          if-no-files-found: error

  test-and-build:
    if: always()
    needs: apple-target
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 汇总全部 Apple 门禁
        env:
          APPLE_RESULT: ${{ needs.apple-target.result }}
        run: |
          test "$APPLE_RESULT" = success
