name: Repository Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 检查必要文件
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README.en.md
          test -f docs/api/DSM_WEB_API_REFERENCE_ZH.md
          test -f docs/development/NATIVE_DSM_FILE_APP_DEVELOPMENT_PLAN_ZH.md
          test -f docs/progress/STATUS.md
          test -f docs/quality/ANDROID_QUALITY_BASELINE_ZH.md
          test -f docs/archive/2026-h2/CROSS_PLATFORM_PARITY_HISTORY.md
          test -f docs/archive/2026-h2/ANDROID_ALIGNMENT_HISTORY_82_89.md
          test -f docs/archive/2026-h2/RELEASE_VALIDATION_HISTORY.md
          test -f contracts/README.md

      - name: 校验 JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done < <(find contracts -type f -name '*.json' -print0)

      - name: 校验 Codex Skill 引导脚本
        run: |
          python -m unittest discover -s tools/codex/tests -p 'test_*.py'
          python tools/codex/generate_android_quality_baseline.py --check
          python tools/codex/check_android_motion_audit.py
          python tools/codex/check_android_page_state_matrix.py
          python tools/codex/check_android_plan_progress.py
          python tools/codex/check_android_touch_targets.py
          python tools/codex/check_android_write_test_matrix.py
          python tools/codex/check_android_structure_debt.py
          python tools/codex/check_documentation.py

      - name: 校验 Fixture 脱敏与契约工具
        run: |
          python -m unittest discover -s tools/fixture-sanitization/tests -p 'test_*.py'
          python -m unittest discover -s tools/contract-validation/tests -p 'test_*.py'
          python tools/contract-validation/validate_fixtures.py
          python -m unittest discover -s tools/request-contract/tests -p 'test_*.py'
          python tools/request-contract/validate_contracts.py

      - name: 校验双语资源与可见文案硬编码
        run: python tools/localization/check_localization.py

      - name: 禁止敏感文件类型
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(har|pcap|pcapng|p12|pfx|mobileprovision|keystore|jks)$'; then
            echo "仓库包含禁止提交的敏感文件类型"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)keystore\.properties$'; then
            echo "仓库包含禁止提交的 Android 签名配置文件 keystore.properties"
            exit 1
          fi
