name: 社区兼容性报告 / Community compatibility report
description: 提交脱敏的 NAS、DSM、套件和功能测试结果 / Submit redacted NAS, DSM, package, and feature test results
title: "[Compatibility] "
labels:
  - compatibility-report
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        感谢参与岚仓社区兼容性计划。请先阅读[中文测试指南](../blob/main/docs/compatibility/COMMUNITY_COMPATIBILITY_GUIDE_ZH.md)；English contributors: read the [test guide](../blob/main/docs/compatibility/COMMUNITY_COMPATIBILITY_GUIDE_EN.md) first.

        **本表单公开可见。不要提交日志、截图、HAR、原始错误、序列号、设备名、地址、QuickConnect ID、账号、真实文件名或路径。**

        **This form is public. Do not submit logs, screenshots, HAR files, raw errors, serial numbers, device names, addresses, QuickConnect IDs, accounts, real file names, or paths.**

  - type: dropdown
    id: schema_version
    attributes:
      label: 报告结构版本 / Report schema version
      description: 当前公开表单只生成 schemaVersion 2 报告。 / This public form currently produces only schemaVersion 2 reports.
      options:
        - "2"
    validations:
      required: true

  - type: dropdown
    id: test_suite_version
    attributes:
      label: 测试套件版本 / Test suite version
      description: 版本 1 包含 14 项基础能力；版本 2 包含这 14 项及 5 项 macOS 桌面云盘能力。 / Version 1 contains 14 base capabilities; version 2 adds five macOS desktop cloud-drive capabilities.
      options:
        - "2 — 19 capabilities / 19 项能力"
        - "1 — 14 capabilities / 14 项能力"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 岚仓版本 / LanStash version
      description: 在 App 的“关于”页面查看；请勿填写自定义调试标识。 / Find this on the About screen; do not include custom debug identifiers.
      placeholder: 0.3.0
    validations:
      required: true

  - type: input
    id: app_commit
    attributes:
      label: 岚仓源码提交 / LanStash source commit
      description: 填写 unknown，或 7 至 40 位十六进制 Git commit（大小写均可）；不要填写分支名或调试标识。 / Enter unknown or a 7-40 character hexadecimal Git commit (either letter case); do not enter a branch name or debug identifier.
      placeholder: unknown
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 客户端平台 / Client platform
      options:
        - macOS
        - iPhone
        - iPad
        - Android
        - Windows
    validations:
      required: true

  - type: input
    id: platform_version
    attributes:
      label: 系统版本 / Platform version
      description: 只填写公开版本号，不填写设备名称。 / Enter only the public OS version, not a device name.
      placeholder: macOS 15.5 / Android 16 / Windows 11 24H2
    validations:
      required: true

  - type: input
    id: nas_model
    attributes:
      label: NAS 产品型号 / NAS product model
      description: 产品型号可以提交；禁止填写序列号或自定义设备名。 / A public product model is allowed; never enter a serial number or custom device name.
      placeholder: DS923+
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: CPU 架构 / CPU architecture
      description: 不确定时选择 unknown。 / Select unknown if unsure.
      options:
        - unknown
        - x86_64
        - aarch64
        - armv7
    validations:
      required: true

  - type: input
    id: dsm_version
    attributes:
      label: DSM 版本 / DSM version
      description: 仅填写由 2 至 4 段数字组成的公开版本号。 / Enter only the public version number containing 2-4 numeric components.
      placeholder: 7.2.2
    validations:
      required: true

  - type: input
    id: dsm_build
    attributes:
      label: DSM Build
      description: 仅填写 4 至 8 位数字，不要附带设备或主机信息。 / Enter only 4-8 digits without device or host information.
      placeholder: "72806"
    validations:
      required: true

  - type: input
    id: dsm_update
    attributes:
      label: DSM Update
      description: 填写 0 至 999 的 Update 编号；没有 Update 时填写 none，不确定时填写 unknown。 / Enter the Update number from 0 to 999, none when absent, or unknown when unsure.
      placeholder: "3"
    validations:
      required: true

  - type: textarea
    id: packages
    attributes:
      label: 相关套件版本 / Relevant package versions
      description: 每行一个公开套件名称和版本；未测试套件时填写 none。 / Enter one public package name and version per line, or none when no package was tested.
      placeholder: |
        File Station: 1.4.1-1595
        Synology Photos: 1.8.2-10090
      render: yaml
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: 连接方式类别 / Connection category
      description: 只选择类别，不填写地址、域名、端口或 QuickConnect ID。 / Select only a category; do not enter an address, domain, port, or QuickConnect ID.
      options:
        - lan
        - quickconnect-direct
        - quickconnect-relay
        - reverse-proxy
        - unknown
    validations:
      required: true

  - type: dropdown
    id: account_role
    attributes:
      label: 账号权限类别 / Account role
      options:
        - standard
        - administrator
        - unknown
    validations:
      required: true

  - type: dropdown
    id: certificate_type
    attributes:
      label: 证书类别 / Certificate category
      description: 不要提交证书正文、域名或指纹。 / Do not submit certificate content, domains, or fingerprints.
      options:
        - public-ca
        - private-ca
        - self-signed
        - unknown
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 只读与登录结果 / Read-only and sign-in results

        保留每个能力 ID，只把值改成 `passed`、`failed`、`partial`、`skipped` 或 `not-supported`。失败或部分通过时，还必须在下方“结构化失败记录”中填写对应白名单字段。

        Keep every capability ID and change only its value to `passed`, `failed`, `partial`, `skipped`, or `not-supported`. Every failed or partial result also requires the corresponding allowlisted fields under “Structured failure records” below.

  - type: textarea
    id: readonly_results
    attributes:
      label: 只读与登录测试 / Read-only and sign-in tests
      description: testSuiteVersion 1 和 2 都必须保留以下 8 项。 / Keep all eight entries for both testSuiteVersion 1 and 2.
      value: |
        connection.resolve: skipped
        authentication.password: skipped
        authentication.otp: skipped
        authentication.restore-session: skipped
        files.list-shares: skipped
        files.browse: skipped
        files.search: skipped
        files.download: skipped
      render: yaml
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 可选受控写入 / Optional controlled writes

        只对专门创建、可以丢弃的测试项目执行。不确定是否安全时保留 `skipped`。不要为了测试执行永久删除或清空回收站。

        Use only disposable items created specifically for testing. Leave a result as `skipped` when unsure. Never perform a permanent deletion or empty a recycle bin for this test.

  - type: textarea
    id: write_results
    attributes:
      label: 受控写入测试 / Controlled write tests
      value: |
        files.upload: skipped
        files.create-folder: skipped
        files.rename: skipped
        files.copy-move: skipped
        files.recycle: skipped
        files.restore: skipped
      render: yaml
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## macOS 桌面云盘 / macOS desktop cloud drive

        这些能力从 testSuiteVersion 2 开始纳入报告。选择版本 1 时保留默认值，由审核者从结构化报告中排除；选择版本 2 时，macOS 未使用正式签名包或未执行对应测试应填写 `skipped`，iPhone、iPad、Android 和 Windows 必须全部填写 `not-supported`。不能用普通文件浏览结果代替 Finder 云盘结论。

        These capabilities start with testSuiteVersion 2. For version 1, leave the defaults and reviewers will exclude them from the structured report. For version 2, use `skipped` on macOS when a properly signed build was unavailable or the check was not performed; on iPhone, iPad, Android, and Windows, every result below must be `not-supported`. Regular file browsing cannot substitute for a Finder cloud-drive result.

  - type: textarea
    id: desktop_drive_results
    attributes:
      label: 桌面云盘测试 / Desktop cloud-drive tests
      value: |
        desktop-drive.mount: skipped
        desktop-drive.browse: skipped
        desktop-drive.download-resume: skipped
        desktop-drive.keep-offline: skipped
        desktop-drive.upgrade-restore: skipped
        # 非 macOS 平台请把以上五项全部改为 not-supported。
        # On non-macOS platforms, change all five results above to not-supported.
      render: yaml
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 结构化失败记录 / Structured failure records

        仅为 `failed` 或 `partial` 能力填写 `failure`，其他状态禁止填写。`stage` 只能是 `setup`、`discovery`、`authentication`、`request`、`submission`、`readback`、`final-state`、`cleanup`、`unknown`；`errorCategory` 只能是 `permission-denied`、`operation-failed`、`connection-failed`、`unexpected-result`、`app-crashed`、`unknown`。`apiName` 填写 `SYNO.*` 名称或 `unknown`，`apiVersion` 填写 1–99 或 `unknown`，`httpStatus` 填写 100–599 或 `null`。

        Add `failure` only for `failed` or `partial`; it is prohibited for other statuses. Use only these `stage` values: `setup`, `discovery`, `authentication`, `request`, `submission`, `readback`, `final-state`, `cleanup`, `unknown`. Use only these `errorCategory` values: `permission-denied`, `operation-failed`, `connection-failed`, `unexpected-result`, `app-crashed`, `unknown`. Set `apiName` to a `SYNO.*` name or `unknown`, `apiVersion` to 1–99 or `unknown`, and `httpStatus` to 100–599 or `null`.

        `retryPerformed` 必须为布尔值，`rawResponseIncluded` 必须为 `false`。禁止增加 `message`、`body`、`path`、`host`、原始错误或原始响应。 / `retryPerformed` must be Boolean and `rawResponseIncluded` must be `false`. Never add `message`, `body`, `path`, `host`, raw-error text, or a raw response.

  - type: textarea
    id: failure_details
    attributes:
      label: 结构化失败记录 / Structured failure records
      description: >-
        每个 failed 或 partial 能力填写一项；没有失败时保留 failures: []。只允许模板中的字段，禁止 message、body、path、host 或原始错误。 /
        Add one item for every failed or partial capability; keep failures: [] when none failed. Use only the template fields; message, body, path, host, and raw errors are prohibited.
      value: |
        failures: []
        # 失败或部分通过时，将上一行替换为以下结构并删除注释符号：
        # For failed or partial results, replace the line above with this structure and remove the comment markers:
        # failures:
        #   - capabilityId: files.download
        #     failure:
        #       stage: request
        #       errorCategory: connection-failed
        #       apiName: unknown
        #       apiVersion: unknown
        #       httpStatus: null
        #       retryPerformed: false
        #       rawResponseIncluded: false
      render: yaml
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与授权确认 / Privacy and authorization
      options:
        - label: 我只测试了自己拥有或获准使用的 NAS、账号和数据。 / I tested only a NAS, account, and data I own or am authorized to use.
          required: true
        - label: 我没有提交日志、截图、HAR、原始响应、凭据、地址、设备标识、账号、真实文件名或路径。 / I did not submit logs, screenshots, HAR files, raw responses, credentials, addresses, device identifiers, accounts, real file names, or paths.
          required: true
        - label: 我没有执行写操作，或所有写操作仅针对专门创建且可以丢弃的测试项目。 / I performed no write operation, or every write operation used only disposable items created specifically for testing.
          required: true

  - type: checkboxes
    id: consent
    attributes:
      label: 公开与使用确认 / Publication and use
      options:
        - label: 我理解本报告公开可见，并同意项目将脱敏后的结构化结果加入社区兼容矩阵。 / I understand that this report is public and allow the project to add its redacted structured results to the community compatibility matrix.
          required: true
