<script>
(function(){
const root=document.getElementById('lanstash-android-review');
const logo=root.querySelector('#ls-logo').innerHTML;
const appearance={theme:'auto'};
const profiles=[
 {name:'家里的 NAS',user:'日常账号',icon:'house',status:'已连接',modules:['files','photos','chat','downloads'],write:true},
 {name:'工作室',user:'管理员',icon:'building-2',status:'已连接',modules:['files','photos','chat','downloads','nas','containers','vmm'],write:true},
 {name:'家庭相册',user:'访客',icon:'images',status:'已连接',modules:['photos'],write:false}
];
const modules=[['files','文件','folder'],['photos','照片','images'],['chat','消息','message-circle'],['downloads','NAS 下载','download'],['nas','控制面板','sliders-horizontal'],['containers','容器','boxes'],['vmm','虚拟机','monitor'],['tasks','任务中心','arrow-down-up'],['settings','应用设置','settings']];
const titles={home:'首页',files:'文件',photos:'照片',chat:'消息',device:'设备',tasks:'任务中心',downloads:'NAS 下载',nas:'控制面板',containers:'容器',vmm:'虚拟机',permissions:'可用功能',settings:'应用设置',login:'连接 NAS',conversation:'山野计划',preview:'文件预览'};
const fileItems=[['旅行计划','folder','8 个项目 · 昨天'],['设计资料','folder','12 个项目 · 10月8日'],['项目简报.pdf','pdf','2.4 MB · 今天 09:12'],['拍摄清单.xlsx','file-spreadsheet','36 KB · 昨天'],['山间日落.jpg','photo','8.6 MB · 10月6日'],['本周安排.txt','file-text','2 KB · 10月5日']];
const apps=[];
const writerId='ls-'+Math.random().toString(36).slice(2);
let revision=0;
const i=(name)=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const escape=(x)=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b=(label,action,cls,icon)=>'<button type="button" class="'+(cls||'')+'" data-act="'+action+'">'+(icon?i(icon):'')+label+'</button>';
const ib=(icon,label,action)=>'<button type="button" class="ls-icon-btn" aria-label="'+label+'" data-act="'+action+'">'+i(icon)+'</button>';
const row=(icon,title,sub,act,end,cls)=>'<button type="button" class="ls-row '+(cls||'')+'" data-act="'+act+'"><span class="ls-file-icon">'+i(icon)+'</span><span class="ls-row-body"><strong>'+title+'</strong>'+(sub?'<small>'+sub+'</small>':'')+'</span>'+(end||i('chevron-right'))+'</button>';
const section=(title,action)=>'<div class="ls-section-title"><h2>'+title+'</h2>'+(action||'')+'</div>';
const notice=(text)=>'<div class="ls-notice">'+i('info')+'<span>'+text+'</span></div>';
const paper=()=>'<div class="ls-paper"><div class="ls-paper-label">STUDIO NOTES / OCTOBER</div><div class="ls-paper-title">把想法<br>慢慢变成日常。</div><div class="ls-paper-block"><span style="height:35%"></span><span style="height:68%"></span><span style="height:51%"></span><span style="height:92%"></span></div><div class="ls-paper-line"></div><div class="ls-paper-line" style="width:85%"></div><div class="ls-paper-line" style="width:68%"></div></div>';
function permitted(s,key){return ['home','device','tasks','settings','permissions','login'].includes(key)||profiles[s.nas].modules.includes(key)||(['conversation','preview'].includes(key)&&profiles[s.nas].modules.includes(key==='conversation'?'chat':'files'));}
function nav(s){return [['home','首页','house'],['files','文件','folder'],['photos','照片','images'],['chat','消息','message-circle'],['device','设备','server']].filter(x=>permitted(s,x[0])).map(x=>'<button type="button" class="ls-nav-item '+((s.page===x[0]||(s.page==='conversation'&&x[0]==='chat')||(s.page==='preview'&&x[0]==='files'))?'active':'')+'" data-act="page:'+x[0]+'" aria-label="'+x[1]+'"><span class="ls-nav-icon">'+i(x[2])+'</span><span>'+x[1]+'</span></button>').join('');}
function pageTitle(s,actions){return '<div class="ls-page-title"><div>'+(['permissions','settings','nas','downloads','containers','vmm','conversation','preview'].includes(s.page)?ib('arrow-left','返回','back'):'')+'<h1>'+titles[s.page]+'</h1></div>'+(actions||'')+'</div>';}
function home(s){const p=profiles[s.nas];return pageTitle(s,permitted(s,'files')?ib('search','搜索文件','search'):'')+'<div class="ls-quick" style="grid-template-columns:repeat('+(p.write?3:2)+',1fr)">'+(p.write?b('上传文件','upload','','upload'):'')+b('浏览照片','page:photos','','images')+(permitted(s,'downloads')?b('新建下载','newdownload','','download'):b('可用功能','page:permissions','','shield-check'))+'</div>'+section('正在进行',b('全部任务','page:tasks','ls-link','arrow-up-right'))+'<button type="button" class="ls-active-task" data-act="page:tasks"><div class="ls-between"><strong>周末旅行 · 12 张照片</strong>'+i('arrow-up-right')+'</div><p class="ls-subtitle">手机 → 家里的 NAS</p><div class="ls-progress"><span style="width:62%"></span></div><div class="ls-between ls-small"><span>已上传 8 张</span><span class="ls-muted">8.2 MB/s</span></div></button>'+(permitted(s,'files')?section('常用位置')+'<div class="ls-folders">'+b(i('folder')+'<strong>工作文件</strong><small>共享文件夹</small>','folder:工作文件','ls-folder-tile')+b(i('folder-heart')+'<strong>生活记录</strong><small>已收藏</small>','folder:生活记录','ls-folder-tile')+'</div>'+section('最近打开',b('查看全部','page:files','ls-link'))+'<div class="ls-surface">'+row('file-text','项目简报.pdf','今天 09:12 · 工作文件','file:2')+row('file-spreadsheet','拍摄清单.xlsx','昨天 · 工作文件','file:3')+'</div>':section('最近照片')+'<div class="ls-gallery">'+[0,1,2,3,4,5].map(n=>b('<span class="ls-art art'+n+'"></span>','photo:'+n,'ls-photo')).join('')+'</div>');}
function files(s){return pageTitle(s,b(s.selecting?'取消':'选择','select','ls-link'))+(s.searching?'<label class="ls-search">'+i('search')+'<input data-field="search" placeholder="搜索此位置" value="'+escape(s.query||'')+'"></label>':'')+'<div class="ls-file-toolbar"><div class="ls-breadcrumb">'+b('共享文件夹','folder:共享文件夹')+i('chevron-right')+b(escape(s.path),'folder:工作文件')+'</div>'+ib('search','搜索','search')+ib('list-filter','排序与筛选','sort')+'</div>'+fileItems.filter(f=>!s.query||f[0].includes(s.query)).map(f=>{let n=fileItems.indexOf(f);return '<div class="ls-file-row '+(s.selected.includes(n)?'selected':'')+'"><button type="button" data-act="file:'+n+'" style="display:flex;align-items:center;gap:11px;flex:1;min-width:0;min-height:48px">'+(s.selecting?'<span class="ls-select-dot '+(s.selected.includes(n)?'selected':'')+'">'+(s.selected.includes(n)?i('check'):'')+'</span>':'')+'<span class="ls-file-icon '+f[1]+'">'+i(f[1]==='photo'?'image':f[1]==='pdf'?'file-text':f[1])+'</span><span class="ls-row-body"><strong>'+f[0]+'</strong><small>'+f[2]+'</small></span></button>'+(!s.selecting?ib('ellipsis-vertical',f[0]+'操作','filemenu:'+n):'')+'</div>';}).join('')+(s.query&&!fileItems.some(f=>f[0].includes(s.query))?'<div class="ls-empty">'+i('search')+'<h2>没有找到文件</h2><p>换一个关键词试试。</p></div>':'')+'<p class="ls-subtitle" style="margin-top:17px">'+fileItems.filter(f=>!s.query||f[0].includes(s.query)).length+' 个项目</p>';}
function photos(s){return pageTitle(s,profiles[s.nas].write?ib('upload','上传照片','upload'):'')+'<div class="ls-tabs">'+b('照片','phototab:photos',s.photoTab==='photos'?'active':'')+b('相册','phototab:albums',s.photoTab==='albums'?'active':'')+'</div>'+(s.nas===1?'<div class="ls-chips">'+b('我的照片','photospace:mine','ls-chip '+(s.photoSpace==='mine'?'active':''))+b('共享照片','photospace:shared','ls-chip '+(s.photoSpace==='shared'?'active':''))+'</div>':'')+(s.nas===2?notice('你可以查看和保存照片。上传与删除未向此账号开放。'):'')+(s.photoTab==='albums'?'<div class="ls-folders">'+[0,1,3,4].map((n,k)=>b('<div style="height:140px;overflow:hidden;border-radius:12px;margin-bottom:11px"><span class="ls-art art'+n+'"></span></div><strong>'+['山野之间','海边慢行','生活片段','春日散步'][k]+'</strong><small>'+[24,18,36,12][k]+' 张照片</small>','album:'+k,'ls-folder-tile')).join('')+'</div>':'<div class="ls-between"><h2>10月 · 山野之间</h2><span class="ls-small ls-muted">12 张</span></div><div class="ls-gallery">'+[0,4,3,1,2,5,4,0,2,3,1,5].map((n,k)=>b('<span class="ls-art art'+n+'"></span>'+(k===5?'<span class="ls-photo-time">0:28</span>':''),'photo:'+n,'ls-photo')).join('')+'</div><h2>9月 · 海边慢行</h2><div class="ls-gallery">'+[1,2,5].map(n=>b('<span class="ls-art art'+n+'"></span>','photo:'+n,'ls-photo')).join('')+'</div>');}
function chat(s){return pageTitle(s,ib('square-pen','新建消息','newchat'))+'<label class="ls-search">'+i('search')+'<input data-field="chatsearch" placeholder="搜索消息与联系人"></label>'+[['山','山野计划','阿宁：周六见，路线已放到共享文件夹。','09:24','2',''],['设','设计小组','你：简报已经更新，大家有空看看。','08:50','','green'],['宁','阿宁','这组照片的光线真好。','昨天','','sand']].map(a=>'<button type="button" class="ls-row ls-chat-row" data-act="conversation"><span class="ls-avatar '+a[5]+'">'+a[0]+'</span><span class="ls-row-body"><strong>'+a[1]+'</strong><small>'+a[2]+'</small></span><span class="ls-chat-side">'+a[3]+(a[4]?'<span class="ls-unread">'+a[4]+'</span>':'')+'</span></button>').join('');}
function conversation(s){return pageTitle(s,ib('ellipsis','聊天详情','chatdetails'))+'<p class="ls-small ls-muted" style="text-align:center;margin:4px 0 22px">今天 09:24</p><div class="ls-conversation"><div class="ls-bubble-line"><span class="ls-avatar sand">宁</span><div><p class="ls-small ls-muted" style="margin-bottom:4px">阿宁</p><div class="ls-bubble">周六见，路线已放到共享文件夹。我们九点出发吧。</div></div></div><div class="ls-bubble-line me"><div class="ls-bubble">好呀，拍摄清单也准备好了。</div></div><div class="ls-bubble-line"><span class="ls-avatar sand">宁</span><div class="ls-bubble" style="width:225px;height:158px;padding:4px"><span class="ls-art art0" style="border-radius:11px"></span></div></div><div class="ls-bubble-line"><span class="ls-avatar sand">宁</span><div class="ls-bubble">上次的山间日落，分享给大家。</div></div>'+s.messages.map(m=>'<div class="ls-bubble-line me"><div class="ls-bubble">'+escape(m)+'</div></div>').join('')+'</div>';}
function permissions(s){const p=profiles[s.nas];return pageTitle(s,b('刷新','refreshpermissions','ls-link','refresh-cw'))+'<div class="ls-surface" style="padding:16px;margin-bottom:10px"><strong>'+p.name+'</strong><p class="ls-subtitle">'+p.user+'</p></div>'+modules.filter(m=>!['tasks','settings'].includes(m[0])).map(m=>{const ok=p.modules.includes(m[0]);return '<div class="ls-permission-row">'+i(m[2])+'<div><strong>'+m[1]+'</strong><small>'+(ok?(m[0]==='photos'&&!p.write?'可以查看与保存':'当前账号可以使用'):'需要此 NAS 的管理员为账号开通')+'</small></div><span class="ls-badge '+(ok?'':'muted')+'">'+(ok?'可使用':'未开放')+'</span></div>';}).join('')+section('手机权限')+'<div class="ls-surface">'+row('wifi','局域网访问','连接同一网络中的 NAS','systempermission','<span class="ls-badge">已允许</span>')+row('bell','通知','传输进度与消息提醒','notifysetting','<span class="ls-badge">已允许</span>')+row('mic','麦克风','录制语音时申请','microphone','<span class="ls-badge muted">未开启</span>')+'</div>';}
function device(s){const p=profiles[s.nas];return pageTitle(s,b('管理连接','naslist','ls-link'))+'<div class="ls-surface ls-device-card"><div class="ls-device-heading"><span class="ls-file-icon">'+i('server')+'</span><div style="flex:1"><h2>'+p.name+'</h2><p class="ls-subtitle">'+p.user+' · 已连接</p></div><span class="ls-dot"></span></div><div class="ls-between ls-small"><span>当前连接</span><span class="ls-muted">局域网 · 安全连接</span></div></div>'+section('账号与访问')+'<div class="ls-surface">'+row('shield-check','可用功能',p.modules.length+' 项功能已开放','page:permissions')+row('key-round','登录与连接','登录状态、连接方式与证书','connectiondetails')+'</div>'+section('NAS 应用')+'<div class="ls-surface">'+(p.modules.includes('nas')?row('sliders-horizontal','控制面板','存储、账号、网络与系统','page:nas'):'')+(p.modules.includes('downloads')?row('download','Download Station','下载任务与订阅','page:downloads'):'')+(p.modules.includes('containers')?row('boxes','Container Manager','容器、映像与网络','page:containers'):'')+(p.modules.includes('vmm')?row('monitor','Virtual Machine Manager','虚拟机与资源','page:vmm'):'')+(p.modules.length===1?row('images','Synology Photos','浏览与保存共享照片','page:photos'):'')+'</div>'+section('此应用')+'<div class="ls-surface">'+row('settings','应用设置','外观、语言与导航','page:settings')+row('log-out','退出当前账号',p.name,'logout')+'</div>';}

function act(a,action){const s=a.state;if(action==='noop')return;
 if(action.startsWith('page:')){s.page=action.slice(5);s.sheet=null;s.query='';s.selecting=false;}
 else if(action.startsWith('switch:')){s.workspaces[s.nas]={page:s.page==='login'?'home':s.page,path:s.path,messages:s.messages,photoTab:s.photoTab,photoSpace:s.photoSpace};s.nas=Number(action.slice(7));const next=s.workspaces[s.nas]||{page:'home',path:'工作文件',messages:[],photoTab:'photos',photoSpace:'mine'};Object.assign(s,next);s.sheet=null;if(!permitted(s,s.page))s.page='home';s.selected=[];s.selecting=false;}
 else if(action==='back'){s.page=s.page==='conversation'?'chat':s.page==='preview'?'files':'device';s.sheet=null;}
 else if(action==='close'){s.sheet=null;}
 else if(action==='select'){s.selecting=!s.selecting;s.selected=[];}
 else if(action==='search'){s.searching=!s.searching;if(s.page!=='files')s.page='files';}
 else if(action.startsWith('folder:')){s.path=action.slice(7);s.page='files';s.sheet=null;}
 else if(action.startsWith('file:')){const n=Number(action.slice(5));if(s.selecting){s.selected=s.selected.includes(n)?s.selected.filter(x=>x!==n):s.selected.concat(n);}else if(fileItems[n][1]==='folder'){s.path=fileItems[n][0];}else{s.fileIndex=n;s.page='preview';}}
 else if(action.startsWith('filemenu:')){s.fileIndex=Number(action.slice(9));s.sheet='filemenu';}
 else if(action.startsWith('photo:')){s.photoIndex=Number(action.slice(6));s.sheet='photo';}
 else if(action.startsWith('phototab:')){s.photoTab=action.slice(9);}
 else if(action.startsWith('photospace:')){s.photoSpace=action.slice(11);}
 else if(action.startsWith('album:')){s.photoTab='photos';}
 else if(action.startsWith('tasknas:')){s.taskNas=action.slice(8);}
 else if(action.startsWith('tasktab:')){s.taskTab=action.slice(8);}
 else if(action==='pause'){s.paused=!s.paused;}
 else if(action==='conversation'){s.page='conversation';}
 else if(action==='sendmessage'){const input=a.el.querySelector('[data-field="message"]');if(input&&input.value.trim())s.messages.push(input.value.trim());render(a);const scroll=a.el.querySelector('.ls-scroll');scroll.scrollTop=scroll.scrollHeight;save();return;}
 else if(action==='copy'){s.destination=s.nas===0?1:0;s.sheet='copy';s.destFolder=false;}
 else if(action==='destfolder'){s.destFolder=true;}
 else if(action==='copyconfirm'){s.added=true;s.page='tasks';s.taskNas='all';s.sheet=null;s.selecting=false;toast(a,'复制任务已加入任务中心');save();return;}
 else if(action.startsWith('theme:')){appearance.theme=action.slice(6);s.sheet=null;apps.forEach(render);save();return;}
 else if(action==='refreshpermissions'){toast(a,'已更新当前账号的可用功能');return;}
 else if(action==='favorite'){toast(a,'已加入收藏');return;}
 else if(action==='saved'){toast(a,'已展示系统分享与保存入口');return;}
 else if(action==='demodelete'){s.page='files';toast(a,'文件已移到回收站');return;}
 else if(action==='demolink'){toast(a,'分享链接已创建');return;}
 else if(action==='createdownload'){s.page='downloads';toast(a,'下载任务已创建');return;}
 else if(action==='democonnect'){s.nas=1;s.page='home';toast(a,'已连接工作室');return;}
 else if(action==='pickupload'){s.page='tasks';toast(a,'上传任务已加入任务中心');return;}
 else if(action==='sendvoice'){s.messages.push('语音消息 · 8 秒');s.sheet=null;}
 else if(action==='playvoice'){toast(a,'试听语音 · 8 秒');return;}
 else{s.sheet=action;}
 render(a);save();}
function restoreState(value){const v=value&&value.privateContent;if(!v)return;if(v.writerId===writerId&&Number(v.revision)<=revision)return;if(!v.writerId&&revision>0)return;if(['auto','light','dark'].includes(v.theme))appearance.theme=v.theme;if(Array.isArray(v.views))apps.forEach((a,n)=>{const s=v.views[n];if(!s)return;if(Object.hasOwn(pages,s.page))a.state.page=s.page;if([0,1,2].includes(s.nas))a.state.nas=s.nas;if(['photos','albums'].includes(s.photoTab))a.state.photoTab=s.photoTab;});apps.forEach(render);}
['ls-phone','ls-tablet'].forEach((id,n)=>{const a={el:document.getElementById(id),tablet:!!n,state:{page:n?'files':'home',nas:n?1:0,sheet:null,path:'工作文件',selecting:false,selected:[],photoTab:'photos',photoSpace:'mine',taskTab:'active',taskNas:'all',destination:1,photoIndex:0,query:'',messages:[],workspaces:{},paused:false,added:false,toast:''}};apps.push(a);render(a);a.el.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(a,t.dataset.act);});a.el.addEventListener('change',e=>{if(e.target.dataset.field==='destination'){a.state.destination=Number(e.target.value);render(a);}});a.el.addEventListener('input',e=>{if(e.target.dataset.field==='search'){const pos=e.target.selectionStart;a.state.query=e.target.value;render(a);const input=a.el.querySelector('[data-field="search"]');input.focus();input.setSelectionRange(pos,pos);}});a.el.addEventListener('submit',e=>{if(e.target.matches('[data-chat-form]')){e.preventDefault();const input=e.target.querySelector('[data-field="message"]');if(input.value.trim())a.state.messages.push(input.value.trim());render(a);save();}});a.el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.dataset.field==='message'){e.preventDefault();act(a,'sendmessage');return;}if(e.key==='Escape'&&a.state.sheet){a.state.sheet=null;render(a);}});});
restoreState(window.openai&&window.openai.widgetState);
window.addEventListener('openai:set_globals',e=>restoreState(e.detail&&e.detail.globals&&e.detail.globals.widgetState));
if(globalThis.Tweak){const controls=new Tweak({container:root,onChange:()=>{apps.forEach(render);save();}});controls.addSelect(appearance,'theme',{label:'外观',options:[{label:'跟随系统',value:'auto'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});apps.forEach(a=>{const t=new Tweak({container:a.el,onChange:()=>{a.state.sheet=null;render(a);save();}});t.addSelect(a.state,'page',{label:'查看页面',options:['home','files','photos','chat','device','tasks','downloads','nas','containers','vmm','permissions','login'].map(x=>({label:titles[x],value:x}))});});}
})();
</script>
